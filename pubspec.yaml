name: fashion_app
description: A comprehensive Flutter fashion e-commerce application with advanced UI/UX.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.0
  
  # Google Sign-In
  google_sign_in: ^6.1.0
  
  # Stripe Payment
  flutter_stripe: ^10.0.0
  
  # UI/UX
  flutter_animate: ^4.2.0
  lottie: ^2.6.0
  cached_network_image: ^3.3.0
  smooth_page_indicator: ^1.1.0
  palette_generator: ^0.3.3
  google_fonts: ^6.1.0
  
  # Utilities
  intl: ^0.19.0
  http: ^1.1.0
  shared_preferences: ^2.2.0
  uuid: ^4.0.0
  flutter_localizations:
    sdk: flutter
  
  # Navigation
  go_router: ^12.0.0
  
  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
  
  fonts:
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
